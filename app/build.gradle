plugins { id 'com.android.application' }
android {
    namespace 'vn.autotax.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'vn.autotax.mobile'
        minSdk 23
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }
}
dependencies { implementation 'androidx.browser:browser:1.8.0' }
