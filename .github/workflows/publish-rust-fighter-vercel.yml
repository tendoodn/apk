name: Publish Rust Fighter TV APKs built on Vercel
on:
  push:
    branches: [feature/rust-fighter-tv-vercel-apk]
    paths: ['.github/workflows/publish-rust-fighter-vercel.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror-vercel-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download binary APKs generated by Vercel Sandbox
        env:
          VERCEL_SANDBOX_BASE: https://sb-6x12s217nfpp.vercel.run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail --location --retry 4 --retry-delay 3 --max-time 300 "${VERCEL_SANDBOX_BASE}/Rust_Fighter_GoogleTV_v0.2.0.apk" -o artifacts/Rust_Fighter_GoogleTV_v0.2.0.apk
          curl --fail --location --retry 4 --retry-delay 3 --max-time 300 "${VERCEL_SANDBOX_BASE}/Rust_Fighter_Remote_Android_v0.2.0.apk" -o artifacts/Rust_Fighter_Remote_Android_v0.2.0.apk
          cat > artifacts/SHA256SUMS.txt <<'SHA'
          49178d400260b432e6194d8b4968f05dac7cdbca85b3bcb6e4c35ec8007443fc  Rust_Fighter_GoogleTV_v0.2.0.apk
          5a42cdfdc088b37e27d3458bc8945798bf9db299a7cf8cf26b760d5c67fd0603  Rust_Fighter_Remote_Android_v0.2.0.apk
          SHA
          (cd artifacts && sha256sum -c SHA256SUMS.txt)
          test -s artifacts/Rust_Fighter_GoogleTV_v0.2.0.apk
          test -s artifacts/Rust_Fighter_Remote_Android_v0.2.0.apk
      - name: Store APKs as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rust-Fighter-TV-Remote-v0.2.0-Vercel-QA
          path: artifacts/
          if-no-files-found: error
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create rust-fighter-tv-v0.2.0-qa1 \
            artifacts/Rust_Fighter_GoogleTV_v0.2.0.apk \
            artifacts/Rust_Fighter_Remote_Android_v0.2.0.apk \
            artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Rust Fighter TV + Remote v0.2.0 — Vercel build QA" \
            --notes "Two debug-signed APKs cross-compiled and assembled on Vercel Sandbox, SHA-256 verified. TV and phone need the same Wi-Fi network. No physical-device QA. Street Fighter-style prototype art is not licensed Capcom source material." \
            --prerelease
