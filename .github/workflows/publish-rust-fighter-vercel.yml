name: Publish Rust Fighter TV APKs built on Vercel
on:
  push:
    branches: [fix/rust-fighter-pairing-portrait-v0.2.1]
    paths: ['.github/workflows/publish-rust-fighter-vercel.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror-vercel-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download binary APKs generated by Vercel Sandbox
        env:
          VERCEL_SANDBOX_BASE: https://sb-4e9kailticnj.vercel.run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail --location --retry 4 --retry-delay 3 --max-time 300 "${VERCEL_SANDBOX_BASE}/Rust_Fighter_GoogleTV_v0.2.1.apk" -o artifacts/Rust_Fighter_GoogleTV_v0.2.1.apk
          curl --fail --location --retry 4 --retry-delay 3 --max-time 300 "${VERCEL_SANDBOX_BASE}/Rust_Fighter_Remote_Android_v0.2.1.apk" -o artifacts/Rust_Fighter_Remote_Android_v0.2.1.apk
          cat > artifacts/SHA256SUMS.txt <<'SHA'
          b6e2c831fbf78756f5466794a56c87a43c5657ec20fa176aff5ab1acb22c9d05  Rust_Fighter_GoogleTV_v0.2.1.apk
          07bdc65d12bc1b8e21deb4a1fd060be48d4b0148a0823110224e65c0555b7405  Rust_Fighter_Remote_Android_v0.2.1.apk
          SHA
          (cd artifacts && sha256sum -c SHA256SUMS.txt)
          test -s artifacts/Rust_Fighter_GoogleTV_v0.2.1.apk
          test -s artifacts/Rust_Fighter_Remote_Android_v0.2.1.apk
      - name: Store APKs as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rust-Fighter-TV-Remote-v0.2.1-Vercel-QA
          path: artifacts/
          if-no-files-found: error
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create rust-fighter-tv-v0.2.1-qa2 \
            artifacts/Rust_Fighter_GoogleTV_v0.2.1.apk \
            artifacts/Rust_Fighter_Remote_Android_v0.2.1.apk \
            artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Rust Fighter TV + Remote v0.2.1 — Vercel build QA" \
            --notes "Pairing and portrait hotfix. Both debug-signed APKs cross-compiled and assembled on Vercel Sandbox, SHA-256 verified. TV and phone need the same Wi-Fi network. No physical-device QA. Street Fighter-style prototype art is not licensed Capcom source material." \
            --prerelease
