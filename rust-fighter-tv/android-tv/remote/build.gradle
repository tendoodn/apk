plugins { id 'com.android.application' }
android {
    namespace 'com.tendoodn.rustfighter.remote'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tendoodn.rustfighter.remote'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '0.2.1-remote2'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
