[package]
name = "rust-fighter-tv"
version = "0.1.0"
edition = "2021"
description = "Original 2D TV fighting game with Rust game server and phone remotes"
license = "MIT"

[lib]
name = "fighter_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.7", features = ["ws", "query"] }
futures-util = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
